services:
  - type: web
    name: mood-detecting-music-player
    env: python
    rootDir: Mood Detecting Music Player/Backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
